<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca ded Pokémon</title>
    <style>
        .card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 16px;
            width: 250px;
            text-align: center;
            margin-top: 16px;
            font-family: sans-serif;
        }
        .erro { color: red; }
        .carregando { color: gray; font-style: italic; }
    </style>
</head>
<body>
    <h1>Busca de Pokémon</h1>

    <form id="formBusca">
        <input type="text" id="campoPokemon" placeholder="Digite o nome do Pokémon">
        <button type="submit">Buscar</button>
    </form>
    <div id="resultado"></div>

    <script src="script.js"></script>
</body>
</html>
